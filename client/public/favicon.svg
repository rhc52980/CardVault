<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d8bff" />
      <stop offset="1" stop-color="#f2b632" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#06070c" />

  <!-- The card behind, dimmed so the front one leads. -->
  <rect x="26" y="11" width="26" height="34" rx="4" fill="#3a4568" />

  <!-- Ground-coloured pad separating the two cards by a gap in the background
       rather than by outlining the front card. -->
  <rect x="11.4" y="17.4" width="29.2" height="37.2" rx="5.6" fill="#06070c" />

  <rect x="13" y="19" width="26" height="34" rx="4" fill="url(#card)" />
</svg>
